name: Tests with Dependency Caching

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    # ============================================================================
    # Caching Strategy Notes for Maintainers:
    # ============================================================================
    # This workflow caches two distinct layers:
    #
    # 1. ~/.cache/pip: Downloaded wheels and source distributions
    #    - Pros: Always safe, survives runner image updates
    #    - Cons: Still need to create virtualenv and install packages each run
    #
    # 2. .venv: Complete virtualenv with installed packages
    #    - Pros: Dramatically faster builds (skip package installation)
    #    - Cons: More fragile; may break if:
    #        * Runner image changes (different system libraries)
    #        * Python patch version updates
    #        * Binary dependencies have ABI incompatibilities
    #
    # Tradeoff: We cache both for maximum speed. If you see cryptic import
    # errors or segfaults after a runner update, remove .venv from the cache
    # paths below and rely solely on pip caching.
    #
    # Cache Key Strategy:
    # - Includes runner.os to separate Linux/macOS/Windows caches
    # - Includes matrix.python-version for Python version changes
    # - Includes hashFiles() of both pyproject.toml and requirements-dev.txt
    #   to invalidate when dependencies change
    # - restore-keys provide fallback: tries same Python version, then any cache
    #
    # Alternative Dependency Managers:
    # - Poetry: Change hash to hashFiles('**/poetry.lock')
    # - Conda: Change path to ~/conda_pkgs_dir or $CONDA/envs/
    # - Pipenv: Change hash to hashFiles('**/Pipfile.lock')
    # ============================================================================

    - name: Cache pip packages and virtualenv
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          .venv
        key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('**/pyproject.toml', '**/requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-py${{ matrix.python-version }}-pip-
          ${{ runner.os }}-py${{ matrix.python-version }}-

    - name: Create and activate virtualenv
      run: |
        python -m venv .venv
        echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install -r requirements-dev.txt

    - name: Run tests
      run: |
        pytest -q
