name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install \
          black \
          isort \
          mypy \
          ruff \
          bandit

    - name: Run Black (check only)
      run: |
        black --check --diff src tests

    - name: Run isort (check only)
      run: |
        isort --check-only --diff src tests

    - name: Run Ruff (lint only)
      run: |
        ruff check src tests

    # Keep MyPy as *informational* here to avoid blocking PRs,
    # Codex will enforce strict mypy before it pushes.
    - name: Run MyPy (non-blocking)
      run: |
        mypy src --ignore-missing-imports || true

    # Bandit runs in CI as a report; Codex can clean findings.
    - name: Run Bandit (non-blocking)
      run: |
        bandit -q -ll -r src || true
