repos:
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        args: ["--line-length", "88"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: ["--fix"]
        # Optional: fail only after fixes applied, so devs see clean state
        # args: ["--fix", "--exit-non-zero-on-fix"]

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort

  # Keep mypy, but make it opt-in so it doesn't block every commit.
  # Run with: `pre-commit run mypy --all-files`
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: ["types-setuptools"]
        args: ["--strict"]
        pass_filenames: false
        stages: [manual]

  # Add Bandit as a manual hook for security scanning
  # Run with: `pre-commit run bandit --all-files`
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["-q", "-ll", "-r", "src"]
        pass_filenames: false
        stages: [manual]

  # Optional: Uncomment to run tests on every commit
  # - repo: local
  #   hooks:
  #     - id: pytest
  #       name: pytest
  #       entry: pytest
  #       language: system
  #       types: [python]
  #       pass_filenames: false
